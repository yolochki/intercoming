name: Build INTERCOMING

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.2-stable
          use-dotnet: false

      - name: Download Export Templates
        run: |
          wget -q -O templates.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q templates.zip
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable/
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          ls ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Export Windows
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" ./build/INTERCOMING.exe
          echo "Windows build complete"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: intercoming-windows
          path: build/INTERCOMING.exe

name: Build INTERCOMING

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows, linux, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.7.2-stable
          use-dotnet: false

      - name: Export Windows
        if: matrix.platform == 'windows'
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" ./build/INTERCOMING.exe
          echo "Windows build complete"

      - name: Export Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build
          godot --headless --export-release "Linux" ./build/INTERCOMING.x86_64
          echo "Linux build complete"

      - name: Export Web
        if: matrix.platform == 'web'
        run: |
          mkdir -p build
          godot --headless --export-release "Web" ./build/INTERCOMING.html
          echo "Web build complete"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: intercoming-${{ matrix.platform }}
          path: build/
